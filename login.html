<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Aluno | Fagner Lage</title>
    <meta name="description" content="Acesse a área do aluno da consultoria online do personal Fagner Lage.">
    <meta name="theme-color" content="#07080b">
    <link rel="icon" href="Assets/img/logo.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./Assets/css/login.css">
</head>

<body>
    <a href="./index.html" class="back"><i class="fa-solid fa-arrow-left"></i> Voltar ao site</a>

    <main class="login-page">

        <!-- Lado esquerdo: chamada (inspirado no material "Como usar o aplicativo") -->
        <section class="intro">
            <a href="./index.html" class="brand"><img src="./Assets/img/banner05.png" alt="Fagner Lage Personal Trainer"></a>
            <h1>Seu treino <br>na palma <br><span>da mão</span></h1>
            <p>Entre na área do aluno para ver seu plano de treino, os vídeos dos exercícios e falar com o seu personal.</p>
            <div class="intro-photo">
                <img src="./administrador/Assets/img/4.jpeg" alt="Personal Fagner Lage na academia">
            </div>
        </section>

        <!-- Lado direito: celular com o formulário -->
        <section class="phone-wrap">
            <div class="phone">
                <div class="phone-notch"></div>
                <div class="phone-screen">

                    <div class="app-logo">
                        <img src="./Assets/img/logo.png" alt="Logo Fagner Lage">
                        <strong>ÁREA DO ALUNO</strong>
                        <small>Consultoria online</small>
                    </div>

                    <!-- Login / cadastro -->
                    <form id="auth-form" novalidate>
                        <div class="field" id="field-name" hidden>
                            <i class="fa-solid fa-user"></i>
                            <input type="text" id="name" placeholder="Nome completo" autocomplete="name">
                        </div>
                        <div class="field">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="email" placeholder="E-mail" autocomplete="email" required>
                        </div>
                        <div class="field">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="password" placeholder="Senha" autocomplete="current-password" required minlength="6">
                            <button type="button" class="toggle-pass" id="toggle-pass" aria-label="Mostrar senha"><i class="fa-solid fa-eye"></i></button>
                        </div>

                        <button type="submit" class="btn-login" id="submit-btn">Entrar</button>

                        <button type="button" class="link" id="forgot-btn">Esqueci a senha</button>
                    </form>

                    <div class="divider"><span>ou</span></div>

                    <button type="button" class="btn-google" id="google-btn">
                        <svg viewBox="0 0 48 48" aria-hidden="true">
                            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
                            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
                            <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
                            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
                        </svg>
                        Entrar com Google
                    </button>

                    <p class="switch">
                        <span id="switch-text">Ainda não tem conta?</span>
                        <button type="button" class="link strong" id="switch-btn">Criar conta</button>
                    </p>

                    <p class="message" id="message" role="alert"></p>

                    <!-- Mostrado depois do login -->
                    <div class="logged" id="logged" hidden>
                        <i class="fa-solid fa-circle-check"></i>
                        <p>Olá, <strong id="user-name"></strong>!</p>
                        <small>Você entrou na área do aluno.</small>
                        <button type="button" class="btn-login" id="logout-btn">Sair</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div class="loading" id="loading" hidden><div class="spinner"></div></div>

    <script type="module" src="./Assets/js/login-aluno.js"></script>
</body>

</html>
