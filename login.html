<body>
    <!-- ===================== Tela: login ===================== -->
    <template id="vista-login">
    <main class="login-page">

        <!-- Painel visual -->
        <section class="visual" aria-hidden="true">
            <img class="visual-photo" src="./administrador/Assets/img/5.jpeg" alt="">
            <div class="visual-shade"></div>
            <span class="glow g1"></span>
            <span class="glow g2"></span>
            <span class="streak s1"></span>
            <span class="streak s2"></span>
            <span class="streak s3"></span>

            <a href="./index.html" class="brand" tabindex="-1">
                <img src="./Assets/img/banner05.png" alt="">
                <span>Fagner Lage<small>Personal trainer</small></span>
            </a>

            <h2 class="visual-title">Entre no seu<br><span>treino!</span></h2>
        </section>

        <!-- Formulário -->
        <section class="panel">
            <div class="panel-inner">
                <a href="./index.html" class="back"><i class="fa-solid fa-arrow-left"></i> Voltar ao site</a>

                <div id="auth-area">
                    <h1 id="title">Entrar</h1>

                    <form id="auth-form" novalidate>
                        <div class="group">
                            <label for="email">Entre com seu e-mail</label>
                            <div class="field">
                                <i class="fa-regular fa-envelope"></i>
                                <input type="email" id="email" placeholder="seunome@gmail.com" autocomplete="email" required>
                            </div>
                        </div>

                        <div class="group">
                            <div class="field">
                                <i class="fa-solid fa-lock"></i>
                                <input type="password" id="password" placeholder="Sua senha" autocomplete="current-password" required minlength="6" aria-label="Senha">
                                <button type="button" class="toggle-pass" id="toggle-pass" aria-label="Mostrar senha"><i class="fa-regular fa-eye"></i></button>
                            </div>
                        </div>

                        <button type="button" class="link forgot" id="forgot-btn">Esqueci a senha</button>

                        <!-- Verificação "Não sou um robô" (Cloudflare Turnstile) -->
                        <div class="robo" id="robo" aria-label="Verificação de segurança"></div>

                        <button type="submit" class="btn-login" id="submit-btn">Entrar</button>
                    </form>

                    <div class="divider"></div>

                    <p class="continue">Ou continue com</p>
                    <div class="social">
                    <button type="button" class="btn-google" id="google-btn">
                        <svg viewBox="0 0 48 48" aria-hidden="true">
                            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
                            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
                            <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
                            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
                        </svg>
                        Google
                    </button>
                    <button type="button" class="btn-google btn-apple" id="apple-btn">
                        <svg viewBox="0 0 384 512" aria-hidden="true"><path fill="currentColor" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
                        Apple
                    </button>
                    </div>

                    <p class="switch">
                        Ainda não é aluno? <a href="./planos.html" class="link strong">Conheça os planos</a>
                    </p>
                </div>

                <p class="message" id="message" role="alert"></p>

                <!-- Mostrado depois do login -->
                <div class="logged" id="logged" hidden>
                    <i class="fa-solid fa-circle-check"></i>
                    <h1>Olá, <span id="user-name"></span>!</h1>
                    <p>Você entrou na área do aluno.</p>
                    <button type="button" class="btn-login" id="logout-btn">Sair</button>
                </div>
            </div>
        </section>
    </main>

    <div class="loading" id="loading" hidden><div class="supino">
        <svg viewBox="0 0 200 130" role="img" aria-label="Carregando: aluno fazendo supino">
          <ellipse class="supino-sombra" cx="104" cy="119" rx="84" ry="5"/>
          <!-- suporte da barra (atrás da cabeça) -->
          <line class="supino-banco-pe" x1="60" y1="115" x2="60" y2="20"/>
          <line class="supino-banco-pe" x1="60" y1="20" x2="68" y2="20"/>
          <!-- banco -->
          <rect class="supino-banco" x="36" y="74" width="100" height="9" rx="4"/>
          <line class="supino-banco-pe" x1="48" y1="83" x2="48" y2="115"/>
          <line class="supino-banco-pe" x1="124" y1="83" x2="124" y2="115"/>
          <!-- pernas: quadril, joelho, pé no chão -->
          <polyline class="supino-corpo" stroke-width="9" points="122,68 152,60 160,112"/>
          <line class="supino-corpo" stroke-width="7" x1="160" y1="112" x2="172" y2="112"/>
          <!-- tronco e cabeça -->
          <line class="supino-corpo" stroke-width="15" x1="64" y1="66" x2="122" y2="68"/>
          <circle class="supino-cabeca" cx="46" cy="65" r="9"/>
          <!-- barra vista de lado (anilha): sobe e desce até o peito -->
          <g>
            <animateTransform attributeName="transform" type="translate" dur="1.6s" repeatCount="indefinite" calcMode="spline"
              keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" values="0,0; 4,30; 0,0"/>
            <circle class="supino-anilha" cx="76" cy="16" r="12"/>
            <circle class="supino-anilha-borda" cx="76" cy="16" r="8"/>
            <circle class="supino-centro" cx="76" cy="16" r="2.5"/>
          </g>
          <!-- braço por cima da anilha: ombro, cotovelo, mão na barra -->
          <polyline class="supino-corpo" stroke-width="8" points="76,62 76,40 76,17">
            <animate attributeName="points" dur="1.6s" repeatCount="indefinite" calcMode="spline"
              keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"
              values="76,62 76,40 76,17; 76,62 94,68 80,47; 76,62 76,40 76,17"/>
          </polyline>
          <circle class="supino-cabeca" r="5">
            <animate attributeName="cx" dur="1.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" values="76;80;76"/>
            <animate attributeName="cy" dur="1.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" values="17;47;17"/>
          </circle>
        </svg>
        <span class="supino-texto">Entrando...</span>
    </div></div>
    </template>

    <!-- ===================== Tela: ficha de inscrição ===================== -->
    <template id="vista-cadastro">
    <header class="cad-top">
        <a href="./index.html" aria-label="Início"><img src="./Assets/img/banner05.png" alt="Fagner Lage Personal Trainer"></a>
        <a href="./login.html" class="cad-top-link"><i class="fa-solid fa-user"></i> Já sou aluno</a>
    </header>

    <main class="cad-main">
        <div class="cad-head" id="cad-head">
            <span class="eyebrow">Ficha de inscrição</span>
            <h1>Comece a sua <span class="accent">consultoria</span></h1>
            <p>Leva uns 5 minutos. Com essas informações o Fagner monta o seu primeiro treino.</p>
        </div>

        <ol class="cad-passos" id="cad-passos" aria-label="Etapas da inscrição">
            <li data-passo="1"><span>Plano e conta</span></li>
            <li data-passo="2"><span>Seus dados</span></li>
            <li data-passo="3"><span>Saúde</span></li>
            <li data-passo="4"><span>Treino e fatura</span></li>
            <li data-passo="5"><span>Termos</span></li>
        </ol>

        <form class="cad-card" id="cad-form" novalidate>

            <!-- ===== 1. Plano e conta ===== -->
            <section class="cad-etapa" data-etapa="1">
                <h2>Plano e conta</h2>
                <p class="sub">Escolha o plano e como você vai entrar na área do aluno.</p>

                <div class="planos-esc" id="cad-planos" role="radiogroup" aria-label="Plano">
                    <p class="dica"><i class="fa-solid fa-spinner fa-spin"></i> Carregando planos...</p>
                </div>

                <div class="cad-bloco">
                    <h3><i class="fa-solid fa-user-lock"></i> Sua conta de acesso</h3>

                    <div id="conta-off">
                        <div class="provedores">
                            <button type="button" class="btn-prov" id="cad-google">
                                <svg viewBox="0 0 48 48" aria-hidden="true">
                                    <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z" />
                                    <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z" />
                                    <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z" />
                                    <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z" />
                                </svg>
                                Continuar com Google
                            </button>
                            <button type="button" class="btn-prov apple" id="cad-apple"><i class="fa-brands fa-apple"></i> Continuar com Apple</button>
                        </div>
                        <div class="ou">ou crie uma senha</div>
                        <div class="grid">
                            <label class="campo c6">E-mail<input type="email" id="c-email" autocomplete="email" placeholder="seunome@gmail.com"></label>
                            <label class="campo c3">Senha<input type="password" id="c-senha" autocomplete="new-password" placeholder="Mínimo 6 caracteres"></label>
                            <label class="campo c3">Repita a senha<input type="password" id="c-senha2" autocomplete="new-password"></label>
                        </div>
                    </div>

                    <div class="conta-on" id="conta-on" hidden>
                        <i class="fa-solid fa-circle-check"></i>
                        <div><small>Conectado como</small><b id="conta-email"></b></div>
                        <button type="button" class="link-btn" id="conta-trocar">Trocar</button>
                    </div>
                </div>
            </section>

            <!-- ===== 2. Seus dados ===== -->
            <section class="cad-etapa" data-etapa="2" hidden>
                <h2>Seus dados</h2>
                <p class="sub">Para o seu cadastro e para o Fagner falar com você.</p>

                <div class="foto-campo" id="foto-campo">
                    <div class="foto-prev" id="foto-prev"><i class="fa-solid fa-user"></i></div>
                    <div>
                        <label class="btn btn-ghost" for="c-foto"><i class="fa-solid fa-camera"></i> Escolher foto de perfil</label>
                        <input type="file" id="c-foto" accept="image/*" hidden>
                        <small>Uma foto de rosto, de frente. Ela aparece só para você e para o personal.</small>
                    </div>
                </div>

                <div class="grid" style="margin-top:20px">
                    <label class="campo c6">Nome completo<input type="text" id="c-nome" autocomplete="name" maxlength="120"></label>
                    <label class="campo c3">CPF<input type="text" id="c-cpf" inputmode="numeric" placeholder="000.000.000-00" maxlength="14"></label>
                    <label class="campo c3">WhatsApp<input type="tel" id="c-whats" inputmode="tel" autocomplete="tel-national" placeholder="(32) 99999-9999" maxlength="15"></label>
                    <label class="campo c6">E-mail<input type="email" id="c-email-conta" readonly><small>Vem da conta que você escolheu na etapa anterior.</small></label>
                    <label class="campo c3">Sexo
                        <select id="c-sexo">
                            <option value="">Selecione</option>
                            <option>Feminino</option><option>Masculino</option><option>Outro</option><option>Prefiro não informar</option>
                        </select>
                    </label>
                    <label class="campo c3">Idade<span class="com-sufixo"><input type="number" id="c-idade" inputmode="numeric" min="10" max="100"><em>anos</em></span></label>
                </div>

                <div class="cad-bloco">
                    <h3><i class="fa-solid fa-location-dot"></i> Endereço</h3>
                    <div class="grid">
                        <label class="campo c2">CEP<input type="text" id="c-cep" inputmode="numeric" placeholder="00000-000" maxlength="9" autocomplete="postal-code"><small id="cep-info"></small></label>
                        <label class="campo c4">Rua / avenida<input type="text" id="c-rua" autocomplete="address-line1" maxlength="150"></label>
                        <label class="campo c2">Número<input type="text" id="c-numero" maxlength="10"></label>
                        <label class="campo c4">Complemento<input type="text" id="c-compl" maxlength="80" placeholder="Opcional"></label>
                        <label class="campo c3">Bairro<input type="text" id="c-bairro" maxlength="80"></label>
                        <label class="campo c2">Cidade<input type="text" id="c-cidade" autocomplete="address-level2" maxlength="80"></label>
                        <label class="campo c1">UF<input type="text" id="c-uf" maxlength="2" autocomplete="address-level1"></label>
                    </div>
                </div>
            </section>

            <!-- ===== 3. Saúde ===== -->
            <section class="cad-etapa" data-etapa="3" hidden>
                <h2>Corpo e saúde</h2>
                <p class="sub">Essas respostas deixam o treino mais seguro para você. Só o personal tem acesso.</p>

                <div class="grid">
                    <label class="campo c2">Peso<span class="com-sufixo"><input type="number" id="c-peso" inputmode="decimal" step="0.1" min="20" max="400"><em>kg</em></span></label>
                    <label class="campo c2">Altura<span class="com-sufixo"><input type="number" id="c-altura" inputmode="numeric" min="100" max="250" placeholder="170"><em>cm</em></span></label>
                    <label class="campo c2">IMC<input type="text" id="c-imc" readonly placeholder="—"></label>
                    <div class="campo c6">Qual é o seu objetivo?
                        <div class="pilulas" id="c-objetivo">
                            <label><input type="radio" name="objetivo" value="Emagrecimento"><span>Emagrecimento</span></label>
                            <label><input type="radio" name="objetivo" value="Hipertrofia"><span>Ganhar massa muscular</span></label>
                            <label><input type="radio" name="objetivo" value="Condicionamento"><span>Condicionamento</span></label>
                            <label><input type="radio" name="objetivo" value="Saúde e qualidade de vida"><span>Saúde e qualidade de vida</span></label>
                            <label><input type="radio" name="objetivo" value="Força"><span>Força</span></label>
                            <label><input type="radio" name="objetivo" value="Outro"><span>Outro</span></label>
                        </div>
                    </div>
                    <label class="campo c6" id="obj-outro-wrap" hidden>Conte o seu objetivo<input type="text" id="c-obj-outro" maxlength="150"></label>
                </div>

                <div class="cad-bloco">
                    <div class="pergunta" data-pergunta="lesao">
                        <div class="pergunta-topo">Tem alguma lesão?
                            <div class="pilulas"><label><input type="radio" name="lesao" value="nao"><span>Não</span></label><label><input type="radio" name="lesao" value="sim"><span>Sim</span></label></div>
                        </div>
                        <label class="campo" hidden>Qual lesão? Onde e há quanto tempo?<textarea id="c-lesao" maxlength="500" placeholder="Ex.: condromalácia no joelho direito, há 2 anos"></textarea></label>
                    </div>
                    <div class="pergunta" data-pergunta="saude">
                        <div class="pergunta-topo">Tem algum problema de saúde?
                            <div class="pilulas"><label><input type="radio" name="saude" value="nao"><span>Não</span></label><label><input type="radio" name="saude" value="sim"><span>Sim</span></label></div>
                        </div>
                        <label class="campo" hidden>Qual problema de saúde?<textarea id="c-saude" maxlength="500" placeholder="Ex.: hipertensão, diabetes, asma, problema cardíaco..."></textarea></label>
                    </div>
                    <div class="pergunta" data-pergunta="medicamento">
                        <div class="pergunta-topo">Usa algum medicamento?
                            <div class="pilulas"><label><input type="radio" name="medicamento" value="nao"><span>Não</span></label><label><input type="radio" name="medicamento" value="sim"><span>Sim</span></label></div>
                        </div>
                        <label class="campo" hidden>Qual medicamento?<textarea id="c-medicamento" maxlength="500" placeholder="Nome e para que serve"></textarea></label>
                    </div>
                    <p class="dica"><i class="fa-solid fa-stethoscope"></i> Se você tem algum problema de saúde ou usa medicamento contínuo, converse com o seu médico antes de começar.</p>
                </div>
            </section>

            <!-- ===== 4. Treino e fatura ===== -->
            <section class="cad-etapa" data-etapa="4" hidden>
                <h2>Treino e fatura</h2>
                <p class="sub">Para o treino caber na sua rotina.</p>

                <div class="grid">
                    <div class="campo c6">Quantos dias por semana você vai treinar?
                        <div class="pilulas quadradas" id="c-dias">
                            <label><input type="radio" name="dias" value="1"><span>1</span></label>
                            <label><input type="radio" name="dias" value="2"><span>2</span></label>
                            <label><input type="radio" name="dias" value="3"><span>3</span></label>
                            <label><input type="radio" name="dias" value="4"><span>4</span></label>
                            <label><input type="radio" name="dias" value="5"><span>5</span></label>
                            <label><input type="radio" name="dias" value="6"><span>6</span></label>

                <p class="dep-intro">Mande uma foto para o Fagner avaliar (postura, execução de um exercício, evolução física). Ele recebe um aviso no WhatsApp com o link da foto.</p>
                <label class="av-foto" id="av-foto-area">
                    <input type="file" id="av-arquivo" accept="image/*">
                    <span class="av-foto-vazia" id="av-foto-vazia"><i class="fa-solid fa-image"></i><b>Toque para escolher a foto</b><small>Da galeria ou tire uma agora</small></span>
                    <img id="av-previa" alt="Prévia da foto" hidden>
                </label>
                <label class="fb-coment">O que você quer que o Fagner avalie? <small class="dep-cont">(opcional)</small>
                    <textarea id="av-obs" rows="3" maxlength="500" placeholder="Ex.: Minha postura no agachamento está certa?"></textarea>
                </label>
                <p class="av-aviso"><i class="fa-regular fa-clock"></i> A foto fica guardada por <b>15 dias</b> e depois é apagada automaticamente. Só o Fagner tem acesso.</p>
                <p class="form-msg" id="av-msg" role="alert"></p>
                <button type="submit" class="btn btn-primary dep-enviar" id="av-enviar"><i class="fa-brands fa-whatsapp"></i> Enviar para o Fagner</button>

        </section>

                    <div><small>Situação</small><span class="badge ok" id="aluno-status">Ativo</span></div>
                    <div id="aluno-fatura-wrap" hidden><small>Fatura</small><b id="aluno-fatura"></b></div>

            </div>

                <a class="btn btn-ghost pix-comprovante" id="pix-comprovante" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> Enviar comprovante</a>
            </div>
            <div class="al-vazio" id="pix-vazio" hidden><i class="fa-solid fa-dollar-sign"></i><p>Para renovar ou pagar o plano, fale com o personal pelo WhatsApp.</p></div>
